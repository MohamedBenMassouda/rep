[project]
name = "rep"
version = "0.1.0"
description = "Calisthenics challenges through the day: hard sets, skill practice and progression, on your desktop."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
rep = "rep.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rep"]
